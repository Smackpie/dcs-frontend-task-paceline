<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Paceline" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Paceline</title>
  <!-- Black rounded tile -->
  <rect width="64" height="64" rx="14" fill="#1A1A18"/>
  <!-- Leaning P + trailing pace lines: everything is skewed to suggest forward motion -->
  <g transform="translate(6 0) skewX(-10)">
    <!-- The P: one stroke for stem and bowl -->
    <path d="M31 49V16h11a9 9 0 0 1 0 18H31" fill="none" stroke="#C8F04A" stroke-width="7" stroke-linejoin="miter"/>
    <!-- The pace line: three bars that shorten as they trail off, last one in orange -->
    <rect x="8"  y="26" width="14" height="4" rx="2" fill="#C8F04A"/>
    <rect x="12" y="35" width="10" height="4" rx="2" fill="#C8F04A"/>
    <rect x="16" y="44" width="6"  height="4" rx="2" fill="#E8552B"/>
  </g>
</svg>
